<style>

  body {

    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #f06a7e, #8e1530);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    margin-top: 24px;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 600;
  }

    margin-top: 12px;

    line-height: 1.6;
  }

  a {
    display: inline-flex;

    padding: 14px 28px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-deep));
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: transform 0.25s ease;
